name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; every push to main must be checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version && swift --version
      - name: Install xcodegen
        run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: Packages/HaloKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/HaloKit/Package.resolved') }}
      - name: Checks (lint, test, iOS build)
        run: ./scripts/check.sh
