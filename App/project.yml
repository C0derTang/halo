# Master-owned. Generate the Xcode project with: xcodegen generate --spec App/project.yml
# Halo.xcodeproj and Halo/Info.plist are generated and gitignored — never hand-edit them.
name: Halo
options:
  bundleIdPrefix: study.paradigm.halo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  HaloKit:
    path: ../Packages/HaloKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
targets:
  Halo:
    type: application
    platform: iOS
    # Halo.xcconfig optionally includes the gitignored Local.xcconfig (team ID, Google client ID).
    configFiles:
      Debug: Halo.xcconfig
      Release: Halo.xcconfig
    sources: [Halo]
    postBuildScripts:
      # Face embedding model fetched by scripts/fetch-models.sh (gitignored, never committed).
      # Optional: without it the app builds and shows "recognition unavailable".
      - name: Bundle face model if present
        basedOnDependencyAnalysis: false
        script: |
          SRC="${PROJECT_DIR}/../Models/HaloFaceEmbedder.mlmodelc"
          if [ -d "$SRC" ]; then
            rsync -a --delete "$SRC" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
          else
            echo "note: Models/HaloFaceEmbedder.mlmodelc not found; recognition unavailable in this build"
          fi
    dependencies:
      - package: HaloKit
        products: [HaloCore, HaloStore, HaloMatching, HaloClustering, HaloTracking, HaloVision, HaloImport, HaloLabels, HaloLens, HaloUI, HaloAppCore, HaloBridgeKit, HaloMemory]
    info:
      path: Halo/Info.plist
      properties:
        CFBundleDisplayName: Halo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Halo uses the camera to recognize people you have enrolled. Video never leaves your device.
        NSPhotoLibraryUsageDescription: Halo scans your photos on-device to suggest people you know. Faces never leave your device.
        NSContactsUsageDescription: Halo links recognized people to your contacts.
        NSFaceIDUsageDescription: Halo locks your people graph behind Face ID.
        NSMicrophoneUsageDescription: Halo lets you dictate a Moment. Audio is transcribed on this device and never stored.
        NSSpeechRecognitionUsageDescription: Halo transcribes Moments on this device only.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: study.paradigm.halo.digest
            UTTypeDescription: Halo iMessage digest
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [halodigest]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Halo iMessage digest
            LSHandlerRank: Owner
            LSItemContentTypes: [study.paradigm.halo.digest]
        LSSupportsOpeningDocumentsInPlace: false
        # Google Photos Picker OAuth client ID (empty = Google import hidden). From Local.xcconfig.
        HaloGoogleClientID: $(HALO_GOOGLE_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: study.paradigm.halo
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
